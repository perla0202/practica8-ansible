services:
  server1:
    image: ubuntu-ssh
    container_name: server1
    hostname: server1
    ports: ["2221:22"]
    networks:
      red_ansible:
        ipv4_address: 172.28.0.11

  server2:
    image: ubuntu-ssh
    container_name: server2
    hostname: server2
    ports: ["2222:22"]
    networks:
      red_ansible:
        ipv4_address: 172.28.0.12

  server3:
    image: ubuntu-ssh
    container_name: server3
    hostname: server3
    ports: ["2223:22"]
    networks:
      red_ansible:
        ipv4_address: 172.28.0.13

  server4:
    image: ubuntu-ssh
    container_name: server4
    hostname: server4
    ports: ["2224:22"]
    networks:
      red_ansible:
        ipv4_address: 172.28.0.14

  server5:
    image: ubuntu-ssh
    container_name: server5
    hostname: server5
    ports: ["2225:22"]
    networks:
      red_ansible:
        ipv4_address: 172.28.0.15

networks:
  red_ansible:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24